[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-knowledge-intelligence"
version = "0.1.0"
description = "Advanced RAG over enterprise documents: hybrid retrieval, cross-encoder reranking, LangGraph query planning, cited answers."
readme = "README.md"
license = "MIT"
authors = [{ name = "Rohith Sadanala" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "langchain-core>=0.2",
    "langchain-openai>=0.1",
    "langgraph>=0.1",
    "faiss-cpu>=1.8",
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
huggingface = [
    "sentence-transformers>=2.7",
    "torch>=2.2",
    "langchain-huggingface>=0.1",
    "transformers>=4.40",
]
chroma = ["chromadb>=0.5"]
deepeval = ["deepeval>=0.21"]
test = ["pytest>=8.0"]

[project.scripts]
eki = "eki.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
