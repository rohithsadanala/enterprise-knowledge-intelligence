<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enterprise Knowledge Intelligence</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --text:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; --border:#334155; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  header { padding:20px 28px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:20px; margin:0; }
  header h1 span { color:var(--accent); }
  #health { font-size:13px; color:var(--muted); }
  main { max-width:860px; margin:0 auto; padding:28px 20px 60px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px; margin-bottom:20px; }
  .card h2 { margin:0 0 12px; font-size:16px; }
  textarea, input[type=text] { width:100%; background:#0f172a; color:var(--text); border:1px solid var(--border); border-radius:8px; padding:10px 12px; font-size:15px; }
  textarea { min-height:64px; resize:vertical; }
  button { background:var(--accent); color:#082f49; border:0; border-radius:8px; padding:10px 18px; font-size:15px; font-weight:600; cursor:pointer; margin-top:10px; }
  button:disabled { opacity:.5; cursor:wait; }
  button.secondary { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  #answer { white-space:pre-wrap; line-height:1.6; }
  .meta { color:var(--muted); font-size:13px; margin-top:8px; }
  .source { border-left:3px solid var(--accent); padding:8px 12px; margin:10px 0; background:#0f172a; border-radius:0 8px 8px 0; }
  .source .title { font-weight:600; }
  .source .snippet { color:var(--muted); font-size:14px; margin-top:4px; }
  .doc { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border); font-size:14px; }
  .doc:last-child { border-bottom:0; }
  .doc button { margin:0; padding:4px 10px; font-size:13px; }
  #status { color:var(--muted); font-size:14px; min-height:20px; }
  .plan { font-size:13px; color:var(--muted); background:#0f172a; border-radius:8px; padding:10px 12px; margin-top:12px; overflow-x:auto; }
</style>
</head>
<body>
<header>
  <h1>Enterprise <span>Knowledge Intelligence</span></h1>
  <div id="health">connecting…</div>
</header>
<main>
  <div class="card">
    <h2>Ask the knowledge base</h2>
    <textarea id="question" placeholder="e.g. What is the remote work policy?"></textarea>
    <button id="askBtn" onclick="ask()">Ask</button>
    <button class="secondary" onclick="ask(true)">Ask (JSON)</button>
    <div id="answer" style="margin-top:16px;"></div>
    <div id="sources"></div>
    <div id="plan" class="plan" style="display:none;"></div>
  </div>

  <div class="card">
    <h2>Ingest documents</h2>
    <p class="meta">PDF, DOCX, Markdown or plain text. Files are chunked, embedded and indexed.</p>
    <input type="file" id="files" multiple accept=".pdf,.docx,.md,.markdown,.txt">
    <button onclick="ingest()">Upload &amp; ingest</button>
    <div id="status"></div>
  </div>

  <div class="card">
    <h2>Indexed documents</h2>
    <div id="docs"><span class="meta">Loading…</span></div>
  </div>
</main>
<script>
async function refreshHealth() {
  try {
    const r = await fetch('/health');
    const h = await r.json();
    document.getElementById('health').textContent =
      `● ${h.documents} docs · ${h.chunks} chunks · ${h.embedding_provider} embeddings · ${h.llm_provider} LLM`;
  } catch (e) { document.getElementById('health').textContent = 'API unreachable'; }
}
async function refreshDocs() {
  const r = await fetch('/documents');
  const docs = await r.json();
  const el = document.getElementById('docs');
  if (!docs.length) { el.innerHTML = '<span class="meta">No documents indexed yet. Upload some above, or run <code>python -m eki.cli ingest docs/sample</code>.</span>'; return; }
  el.innerHTML = docs.map(d =>
    `<div class="doc"><span>${d.title} <span class="meta">(${d.id})</span></span><button onclick="removeDoc('${d.id}')">Remove</button></div>`
  ).join('');
}
async function removeDoc(id) {
  await fetch('/documents/' + encodeURIComponent(id), { method: 'DELETE' });
  refreshDocs(); refreshHealth();
}
async function ask(asJson) {
  const q = document.getElementById('question').value.trim();
  if (!q) return;
  const btn = document.getElementById('askBtn');
  btn.disabled = true;
  document.getElementById('answer').textContent = 'Thinking…';
  document.getElementById('sources').innerHTML = '';
  document.getElementById('plan').style.display = 'none';
  try {
    const r = await fetch('/query', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ question: q }) });
    const data = await r.json();
    if (asJson) {
      document.getElementById('answer').textContent = JSON.stringify(data, null, 2);
    } else {
      document.getElementById('answer').textContent = data.answer;
      document.getElementById('sources').innerHTML = '<h3 style="margin:18px 0 6px;font-size:15px;">Sources</h3>' +
        data.citations.map((c, i) =>
          `<div class="source"><div class="title">[${i+1}] ${c.doc_title}${c.page ? ', p. ' + c.page : ''}</div><div class="snippet">${c.snippet}</div></div>`
        ).join('');
      const plan = document.getElementById('plan');
      plan.style.display = 'block';
      plan.textContent = `plan: ${JSON.stringify(data.query_plan)} · ${data.latency_ms} ms · ${data.retrieved_count} chunks retrieved`;
    }
  } catch (e) {
    document.getElementById('answer').textContent = 'Error: ' + e;
  }
  btn.disabled = false;
  refreshHealth();
}
async function ingest() {
  const input = document.getElementById('files');
  if (!input.files.length) { document.getElementById('status').textContent = 'Choose at least one file first.'; return; }
  const form = new FormData();
  for (const f of input.files) form.append('files', f);
  document.getElementById('status').textContent = 'Uploading…';
  const r = await fetch('/ingest', { method: 'POST', body: form });
  const data = await r.json();
  document.getElementById('status').textContent = r.ok
    ? `Ingested ${data.ingested} file(s): ` + data.results.map(x => `${x.title} (${x.chunks} chunks)`).join(', ')
    : 'Error: ' + (data.detail || r.statusText);
  input.value = '';
  refreshDocs(); refreshHealth();
}
document.getElementById('question').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); }
});
refreshHealth(); refreshDocs();
</script>
</body>
</html>
